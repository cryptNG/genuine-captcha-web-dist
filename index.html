    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@300;400;500;600;700&display=swap');

        :root {
            --primary: #6366f1;
            --primary-dark: #4f46e5;
            --primary-light: #a5b4fc;
            --primary-gradient: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%);
            --secondary: #10b981;
            --secondary-dark: #059669;
            --secondary-light: #6ee7b7;
            --secondary-gradient: linear-gradient(135deg, #10b981 0%, #059669 100%);
            --accent: #f43f5e;
            --accent-dark: #e11d48;
            --accent-light: #fda4af;
            --dark: #0f172a;
            --dark-2: #1e293b;
            --light: #f8fafc;
            --light-2: #e2e8f0;
            --gray: #64748b;
            --gray-light: #cbd5e1;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
            --border-radius: 12px;
            --border-radius-lg: 24px;
            --border-radius-sm: 6px;
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            --shadow-lg: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
            --shadow-xl: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
            --shadow-inner: inset 0 2px 4px 0 rgba(0, 0, 0, 0.06);
            --font-sans: 'Outfit', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            --font-display: 'Space Grotesk', sans-serif;
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            --transition-bounce: all 0.5s cubic-bezier(0.68, -0.6, 0.32, 1.6);
        }

        /* Dark mode variables */
        .dark {
            --primary: #818cf8;
            --primary-dark: #6366f1;
            --primary-light: #c7d2fe;
            --secondary: #34d399;
            --secondary-dark: #10b981;
            --secondary-light: #a7f3d0;
            --dark: #f8fafc;
            --dark-2: #e2e8f0;
            --light: #0f172a;
            --light-2: #1e293b;
            --gray: #94a3b8;
            --gray-light: #334155;
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.2), 0 2px 4px -1px rgba(0, 0, 0, 0.1);
            --shadow-lg: 0 10px 25px -5px rgba(0, 0, 0, 0.2), 0 10px 10px -5px rgba(0, 0, 0, 0.1);
            --shadow-xl: 0 20px 25px -5px rgba(0, 0, 0, 0.2), 0 10px 10px -5px rgba(0, 0, 0, 0.1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
            font-size: 16px;
            scroll-padding-top: 80px;
        }

        body {
            font-family: var(--font-sans);
            background-color: var(--light);
            color: var(--dark);
            line-height: 1.6;
            transition: var(--transition);
            overflow-x: hidden;
        }

        h1, h2, h3, h4, h5, h6 {
            font-family: var(--font-display);
            font-weight: 700;
            line-height: 1.2;
            margin-bottom: 1rem;
        }

        h1 {
            font-size: 3.5rem;
            background: var(--primary-gradient);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            letter-spacing: -0.02em;
        }

        h2 {
            font-size: 2.5rem;
            letter-spacing: -0.01em;
        }

        h3 {
            font-size: 1.75rem;
        }

        p {
            margin-bottom: 1rem;
        }

        a {
            color: var(--primary);
            text-decoration: none;
            transition: var(--transition);
            position: relative;
        }

        a:hover {
            color: var(--primary-dark);
        }

        a.underline-link::after {
            content: '';
            position: absolute;
            bottom: -2px;
            left: 0;
            width: 0;
            height: 2px;
            background-color: var(--primary);
            transition: var(--transition);
        }

        a.underline-link:hover::after {
            width: 100%;
        }

        .container {
            width: 100%;
            max-width: 1280px;
            margin: 0 auto;
            padding: 0 1.5rem;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 0.75rem 1.75rem;
            background: var(--primary-gradient);
            color: white;
            border-radius: var(--border-radius);
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition-bounce);
            border: none;
            text-align: center;
            position: relative;
            overflow: hidden;
            z-index: 1;
            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.3);
        }

        .btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--primary-dark);
            z-index: -1;
            transform: scaleX(0);
            transform-origin: right;
            transition: transform 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(99, 102, 241, 0.4);
        }

        .btn:hover::before {
            transform: scaleX(1);
            transform-origin: left;
        }

        .btn:active {
            transform: translateY(-1px);
        }

        .btn-secondary {
            background: var(--secondary-gradient);
            box-shadow: 0 4px 15px rgba(16, 185, 129, 0.3);
        }

        .btn-secondary::before {
            background: var(--secondary-dark);
        }

        .btn-secondary:hover {
            box-shadow: 0 8px 20px rgba(16, 185, 129, 0.4);
        }

        .btn-outline {
            background: transparent;
            border: 2px solid var(--primary);
            color: var(--primary);
            box-shadow: none;
        }

        .btn-outline::before {
            background: var(--primary);
        }

        .btn-outline:hover {
            color: white;
            box-shadow: 0 8px 20px rgba(99, 102, 241, 0.2);
        }

        .btn-accent {
            background: linear-gradient(135deg, var(--accent) 0%, var(--accent-dark) 100%);
            box-shadow: 0 4px 15px rgba(244, 63, 94, 0.3);
        }

        .btn-accent::before {
            background: var(--accent-dark);
        }

        .btn-accent:hover {
            box-shadow: 0 8px 20px rgba(244, 63, 94, 0.4);
        }

        .btn-icon {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }

        .btn-icon i {
            font-size: 1.2rem;
        }

        /* Header */
        header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            background-color: rgba(248, 250, 252, 0.9);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            z-index: 1000;
            transition: var(--transition);
        }

        .dark header {
            background-color: rgba(15, 23, 42, 0.9);
        }

        .header-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem 1.5rem;
        }

        .logo {
            font-family: var(--font-display);
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--primary);
            display: flex;
            align-items: center;
            position: relative;
        }

        .logo::before {
            content: '';
            position: absolute;
            width: 30px;
            height: 30px;
            background-color: var(--primary-light);
            border-radius: 50%;
            opacity: 0.3;
            z-index: -1;
            animation: pulse 3s infinite;
        }

        @keyframes pulse {
            0% {
                transform: scale(1);
                opacity: 0.3;
            }
            50% {
                transform: scale(1.5);
                opacity: 0.1;
            }
            100% {
                transform: scale(1);
                opacity: 0.3;
            }
        }

        .logo img {
            height: 40px;
            margin-right: 0.5rem;
        }

        .nav-toggle {
            display: none;
            background: none;
            border: none;
            font-size: 1.5rem;
            cursor: pointer;
            color: var(--dark);
            z-index: 1001;
        }

        .nav-menu {
            display: flex;
            list-style: none;
            gap: 1.5rem;
        }

        .nav-item {
            position: relative;
        }

        .nav-link {
            color: var(--dark);
            font-weight: 500;
            position: relative;
            padding: 0.5rem 0;
        }

        .nav-link::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 0;
            height: 2px;
            background-color: var(--primary);
            transition: var(--transition);
        }

        .nav-link:hover {
            color: var(--primary);
        }

        .nav-link:hover::after {
            width: 100%;
        }

        /* Hero Section */
        .hero {
            padding: 10rem 0 0rem;
            background: radial-gradient(circle at 10% 20%, rgba(99, 102, 241, 0.1) 0%, rgba(16, 185, 129, 0.05) 90%);
            position: relative;
            overflow: hidden;
            height: fit-content;
        }

        .hero::before {
            content: '';
            position: absolute;
            top: -50%;
            right: -50%;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, rgba(99, 102, 241, 0.1) 0%, transparent 70%);
            z-index: 0;
        }

        .hero::after {
            content: '';
            position: absolute;
            bottom: -50%;
            left: -50%;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, rgba(16, 185, 129, 0.1) 0%, transparent 70%);
            z-index: 0;
        }

        .hero-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            max-width: 900px;
            margin: 0 auto;
            position: relative;
            z-index: 1;
        }

        .hero-badge {
            display: inline-block;
            padding: 0.5rem 1rem;
            background-color: rgba(99, 102, 241, 0.1);
            color: var(--primary);
            border-radius: 50px;
            font-weight: 600;
            font-size: 0.875rem;
            margin-bottom: 1.5rem;
            transform: translateY(20px);
            opacity: 0;
            animation: fadeInUp 0.6s forwards 0.2s;
        }

        .hero-title {
            margin-bottom: 1.5rem;
            transform: translateY(20px);
            opacity: 0;
            animation: fadeInUp 0.6s forwards 0.4s;
        }

        .hero-subtitle {
            font-size: 1.5rem;
            margin-bottom: 2.5rem;
            color: var(--gray);
            max-width: 700px;
            transform: translateY(20px);
            opacity: 0;
            animation: fadeInUp 0.6s forwards 0.6s;
        }

        .hero-buttons {
            display: flex;
            gap: 1rem;
            margin-bottom: 3rem;
            transform: translateY(20px);
            opacity: 0;
            animation: fadeInUp 0.6s forwards 0.8s;
        }

        .hero-image {
            width: 100%;
            max-width: 800px;
            margin: 0 auto;
            position: relative;
            transform: translateY(20px);
            opacity: 0;
            animation: fadeInUp 0.6s forwards 1s;
        }

        .hero-image img {
            width: 100%;
            height: auto;
            border-radius: var(--border-radius-lg);
            box-shadow: var(--shadow-xl);
        }

        .floating {
            animation: floating 3s ease-in-out infinite;
        }

        @keyframes floating {
            0% {
                transform: translateY(0px);
            }
            50% {
                transform: translateY(-15px);
            }
            100% {
                transform: translateY(0px);
            }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Features Section */
        .section {
            padding: 8rem 0;
            position: relative;
            overflow: hidden;
        }

        .section-pattern {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            z-index: -1;
            opacity: 0.05;
            background-image: 
                radial-gradient(circle at 25px 25px, var(--primary) 2%, transparent 0%),
                radial-gradient(circle at 75px 75px, var(--primary) 2%, transparent 0%);
            background-size: 100px 100px;
        }

        .section-title-container {
            text-align: center;
            margin-bottom: 4rem;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .section-subtitle {
            display: inline-block;
            padding: 0.5rem 1rem;
            background-color: rgba(99, 102, 241, 0.1);
            color: var(--primary);
            border-radius: 50px;
            font-weight: 600;
            font-size: 0.875rem;
            margin-bottom: 1rem;
            order: -1; /* This moves it above the title */
        }

        .section-title {
            margin-bottom: 1.5rem;
            position: relative;
            display: inline-block;
        }

        .section-title::after {
            content: '';
            position: absolute;
            bottom: -10px;
            left: 50%;
            transform: translateX(-50%);
            width: 80px;
            height: 4px;
            background: var(--primary-gradient);
            border-radius: 2px;
        }

        .section-description {
            max-width: 700px;
            margin: 0 auto;
            color: var(--gray);
            font-size: 1.1rem;
        }

        .features {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 2.5rem;
        }

        .feature-card {
            background-color: var(--light);
            border-radius: var(--border-radius-lg);
            padding: 2.5rem;
            box-shadow: var(--shadow);
            transition: var(--transition);
            height: 100%;
            border: 1px solid var(--gray-light);
            position: relative;
            z-index: 1;
            overflow: hidden;
        }

        .feature-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, rgba(99, 102, 241, 0.05) 0%, rgba(16, 185, 129, 0.05) 100%);
            z-index: -1;
            opacity: 0;
            transition: var(--transition);
        }

        .feature-card:hover {
            transform: translateY(-10px);
            box-shadow: var(--shadow-lg);
            border-color: var(--primary-light);
        }

        .feature-card:hover::before {
            opacity: 1;
        }

        .feature-icon {
            font-size: 2.5rem;
            color: var(--primary);
            margin-bottom: 1.5rem;
            display: inline-block;
            position: relative;
        }

        .feature-icon::after {
            content: '';
            position: absolute;
            width: 40px;
            height: 40px;
            background-color: var(--primary-light);
            border-radius: 50%;
            top: -5px;
            left: -5px;
            z-index: -1;
            opacity: 0.3;
        }

        .feature-title {
            font-size: 1.5rem;
            margin-bottom: 1rem;
            position: relative;
            display: inline-block;
        }

        .feature-title::after {
            content: '';
            position: absolute;
            bottom: -5px;
            left: 0;
            width: 40px;
            height: 3px;
            background: var(--primary-gradient);
            border-radius: 1.5px;
            transition: var(--transition);
        }

        .feature-card:hover .feature-title::after {
            width: 60px;
        }

        /* Why Section */
        .why-section {
            background-color: var(--light-2);
        }

        .dark .why-section {
            background-color: var(--light-2);
        }

        .card {
            background-color: var(--light);
            border-radius: var(--border-radius-lg);
            padding: 2.5rem;
            box-shadow: var(--shadow);
            margin-bottom: 2.5rem;
            border: 1px solid var(--gray-light);
            transition: var(--transition);
            position: relative;
            overflow: hidden;
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 4px;
            height: 100%;
            background: var(--primary-gradient);
            transform: scaleY(0);
            transform-origin: bottom;
            transition: transform 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: var(--shadow-lg);
        }

        .card:hover::before {
            transform: scaleY(1);
        }

        .card-title {
            font-size: 1.75rem;
            margin-bottom: 1.5rem;
            color: var(--primary);
            position: relative;
            display: inline-block;
        }

        .card-title::after {
            content: '';
            position: absolute;
            bottom: -5px;
            left: 0;
            width: 40px;
            height: 3px;
            background: var(--primary-gradient);
            border-radius: 1.5px;
            transition: var(--transition);
        }

        .card:hover .card-title::after {
            width: 60px;
        }

        .card-content {
            margin-bottom: 1.5rem;
        }

        .card-list {
            list-style-position: outside;
            margin-left: 1.5rem;
            margin-bottom: 1.5rem;
        }

        .card-list li {
            margin-bottom: 0.75rem;
            position: relative;
        }

        .card-list li::before {
            content: '✓';
            color: var(--primary);
            position: absolute;
            left: -1.5rem;
            font-weight: bold;
        }

        /* How-To Section */
        .steps {
            counter-reset: step;
        }

        .step {
            position: relative;
            padding: 2.5rem;
            background-color: var(--light);
            border-radius: var(--border-radius-lg);
            box-shadow: var(--shadow);
            margin-bottom: 3rem;
            border: 1px solid var(--gray-light);
            transition: var(--transition);
            overflow: hidden;
        }

        .step::before {
            counter-increment: step;
            content: counter(step);
            position: absolute;
            top: 1.5rem;
            left: 1.5rem;
            width: 2.5rem;
            height: 2.5rem;
            background: var(--primary-gradient);
            color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 1.25rem;
            z-index: 1;
        }

        .step::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, rgba(99, 102, 241, 0.05) 0%, rgba(16, 185, 129, 0.05) 100%);
            z-index: -1;
            opacity: 0;
            transition: var(--transition);
        }

        .step:hover {
            transform: translateY(-5px);
            box-shadow: var(--shadow-lg);
            border-color: var(--primary-light);
        }

        .step:hover::after {
            opacity: 1;
        }

        .step-content {
            padding-left: 3.5rem;
        }

        .step-title {
            font-size: 1.5rem;
            margin-bottom: 1rem;
            color: var(--dark);
        }

        .code-block {
            background-color: var(--dark-2);
            color: var(--light);
            padding: 1.5rem;
            border-radius: var(--border-radius);
            overflow-x: auto;
            margin: 1.5rem 0;
            font-family: 'Fira Code', monospace;
            font-size: 0.9rem;
            line-height: 1.5;
            position: relative;
        }

        .code-block::before {
            content: 'Code';
            position: absolute;
            top: 0;
            right: 0;
            background: var(--primary-gradient);
            color: white;
            padding: 0.25rem 0.75rem;
            font-size: 0.75rem;
            border-radius: 0 var(--border-radius) 0 var(--border-radius-sm);
            font-family: var(--font-sans);
        }

        .response-block {
            background-color: var(--dark-2);
            color: var(--light);
            padding: 1.5rem;
            border-radius: var(--border-radius);
            overflow-x: auto;
            margin: 1.5rem 0;
            font-family: 'Fira Code', monospace;
            font-size: 0.9rem;
            line-height: 1.5;
            position: relative;
        }

        .response-block::before {
            content: 'Response';
            position: absolute;
            top: 0;
            right: 0;
            background: var(--secondary-gradient);
            color: white;
            padding: 0.25rem 0.75rem;
            font-size: 0.75rem;
            border-radius: 0 var(--border-radius) 0 var(--border-radius-sm);
            font-family: var(--font-sans);
        }

        /* Pricing Section */
        .pricing-section {
            background: radial-gradient(circle at 90% 10%, rgba(99, 102, 241, 0.1) 0%, rgba(16, 185, 129, 0.05) 90%);
        }

        .pricing-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 2.5rem;
            margin-top: 3rem;
        }

        .pricing-card {
            background-color: var(--light);
            border-radius: var(--border-radius-lg);
            padding: 3rem 2.5rem;
            box-shadow: var(--shadow);
            transition: var(--transition);
            border: 1px solid var(--gray-light);
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .pricing-card.popular {
            transform: scale(1.05);
            z-index: 2;
            border-color: var(--primary-light);
        }

        .pricing-card.popular::before {
            content: 'Most Popular';
            position: absolute;
            top: 1.5rem;
            right: -4rem;
            background: var(--primary-gradient);
            color: white;
            padding: 0.5rem 4rem;
            font-size: 0.75rem;
            transform: rotate(45deg);
            font-weight: 600;
        }

        .pricing-card:hover {
            transform: translateY(-10px);
            box-shadow: var(--shadow-lg);
            border-color: var(--primary-light);
        }

        .pricing-card.popular:hover {
            transform: scale(1.05) translateY(-10px);
        }

        .pricing-header {
            text-align: center;
            margin-bottom: 2rem;
            padding-bottom: 2rem;
            border-bottom: 1px solid var(--gray-light);
        }

        .pricing-name {
            font-size: 1.5rem;
            margin-bottom: 1rem;
            color: var(--dark);
        }

        .pricing-price {
            font-size: 3rem;
            font-weight: 700;
            color: var(--primary);
            margin-bottom: 0.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .pricing-price span {
            font-size: 1.25rem;
            margin-right: 0.25rem;
        }

        .pricing-period {
            color: var(--gray);
            font-size: 0.875rem;
        }

        .pricing-description {
            margin-bottom: 2rem;
            text-align: center;
            color: var(--gray);
        }

        .pricing-features {
            list-style: none;
            margin-bottom: 2rem;
            flex-grow: 1;
        }

        .pricing-feature {
            display: flex;
            align-items: center;
            margin-bottom: 1rem;
        }

        .pricing-feature i {
            color: var(--primary);
            margin-right: 0.75rem;
            font-size: 1.1rem;
        }

        .pricing-cta {
            margin-top: auto;
        }

        .pricing-btn {
            width: 100%;
        }

        /* Contact Form */
        .contact-section {
            background-color: var(--light);
        }

        .contact-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 3rem;
        }

        .contact-info {
            padding: 2rem;
        }

        .contact-info-item {
            display: flex;
            align-items: flex-start;
            margin-bottom: 1.5rem;
        }

        .contact-info-icon {
            color: var(--primary);
            font-size: 1.5rem;
            margin-right: 1rem;
        }

        .contact-info-content h4 {
            margin-bottom: 0.5rem;
        }

        .contact-form {
            background-color: var(--light);
            border-radius: var(--border-radius-lg);
            padding: 2.5rem;
            box-shadow: var(--shadow);
            border: 1px solid var(--gray-light);
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 500;
        }

        .form-control {
            width: 100%;
            padding: 0.75rem 1rem;
            border: 1px solid var(--gray-light);
            border-radius: var(--border-radius);
            background-color: var(--light);
            color: var(--dark);
            transition: var(--transition);
        }

        .form-control:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.2);
        }

        .form-check {
            display: flex;
            align-items: flex-start;
            margin-bottom: 1.5rem;
        }

        .form-check-input {
            margin-right: 0.75rem;
            margin-top: 0.25rem;
        }

        .form-check-label {
            font-size: 0.875rem;
            color: var(--gray);
        }

        /* CTA Section */
        .cta-section {
            background: var(--primary-gradient);
            color: white;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .cta-section::before {
            content: '';
            position: absolute;
            top: -50%;
            right: -50%;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.1) 0%, transparent 70%);
            z-index: 0;
        }

        .cta-section::after {
            content: '';
            position: absolute;
            bottom: -50%;
            left: -50%;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.1) 0%, transparent 70%);
            z-index: 0;
        }

        .cta-content {
            position: relative;
            z-index: 1;
        }

        .cta-title {
            color: white;
            margin-bottom: 1.5rem;
        }

        .cta-description {
            color: rgba(255, 255, 255, 0.9);
            max-width: 700px;
            margin: 0 auto 2.5rem;
            font-size: 1.1rem;
        }

        .cta-buttons {
            display: flex;
            justify-content: center;
            gap: 1rem;
        }

        .cta-btn {
            background-color: white;
            color: black; /* Changed from var(--primary) to black */
            font-weight: 700;
            text-shadow: 0 0 1px rgba(0, 0, 0, 0.2);
        }

        .cta-btn::before {
            background-color: rgba(255, 255, 255, 0.9);
        }

        .cta-btn:hover {
            color: black; /* Changed from var(--primary) to black */
        }

        /* Footer */
        footer {
            background-color: var(--dark);
            color: var(--light);
            padding: 5rem 0 2rem;
            position: relative;
            overflow: hidden;
        }

        footer::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 5px;
            background: var(--primary-gradient);
        }

        .footer-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 3rem;
        }

        .footer-logo {
            font-family: var(--font-display);
            font-size: 1.5rem;
            font-weight: 700;
            color: white;
            margin-bottom: 1.5rem;
            display: inline-block;
        }

        .footer-description {
            color: var(--gray);
            margin-bottom: 1.5rem;
        }

        .footer-social {
            display: flex;
            gap: 1rem;
            margin-bottom: 1.5rem;
        }

        .footer-social-link {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 2.5rem;
            height: 2.5rem;
            background-color: rgba(255, 255, 255, 0.1);
            color: white;
            border-radius: 50%;
            transition: var(--transition);
        }

        .footer-social-link:hover {
            background-color: var(--primary);
            transform: translateY(-3px);
        }

        .footer-heading {
            color: white;
            margin-bottom: 1.5rem;
            font-size: 1.25rem;
            position: relative;
            display: inline-block;
        }

        .footer-heading::after {
            content: '';
            position: absolute;
            bottom: -5px;
            left: 0;
            width: 30px;
            height: 2px;
            background: var(--primary-gradient);
            border-radius: 1px;
        }

        .footer-links {
            list-style: none;
        }

        .footer-link-item {
            margin-bottom: 0.75rem;
        }

        .footer-link {
            color: var(--gray);
            transition: var(--transition);
            display: inline-flex;
            align-items: center;
        }

        .footer-link i {
            margin-right: 0.5rem;
            font-size: 0.75rem;
            transition: var(--transition);
        }

        .footer-link:hover {
            color: white;
            transform: translateX(5px);
        }

        .footer-link:hover i {
            color: var(--primary);
        }

        .footer-bottom {
            margin-top: 3rem;
            padding-top: 2rem;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            text-align: center;
            color: var(--gray);
        }

        .footer-bottom a {
            color: var(--primary-light);
        }

        .footer-bottom a:hover {
            color: white;
        }

        /* Dark Mode Toggle */
        .theme-toggle {
            position: fixed;
            bottom: 2rem;
            right: 2rem;
            width: 3.5rem;
            height: 3.5rem;
            border-radius: 50%;
            background: var(--primary-gradient);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 999;
            box-shadow: var(--shadow-lg);
            transition: var(--transition-bounce);
        }

        .theme-toggle:hover {
            transform: scale(1.1);
        }

        .theme-toggle i {
            font-size: 1.5rem;
            transition: var(--transition);
        }

        /* Modal */
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(15, 23, 42, 0.8);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2000;
            opacity: 0;
            visibility: hidden;
            transition: var(--transition);
        }

        .modal.active {
            opacity: 1;
            visibility: visible;
        }

        .modal-content {
            background-color: var(--light);
            border-radius: var(--border-radius-lg);
            padding: 2.5rem;
            max-width: 600px;
            width: 90%;
            max-height: 90vh;
            overflow-y: auto;
            transform: translateY(20px);
            transition: var(--transition);
            position: relative;
        }

        .modal.active .modal-content {
            transform: translateY(0);
        }

        .modal-close {
            position: absolute;
            top: 1rem;
            right: 1rem;
            background: none;
            border: none;
            font-size: 1.5rem;
            color: var(--gray);
            cursor: pointer;
            transition: var(--transition);
        }

        .modal-close:hover {
            color: var(--danger);
        }

        .modal-title {
            margin-bottom: 1.5rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid var(--gray-light);
        }

        /* Privacy Policy & Terms */
        .legal-content {
            max-height: 400px;
            overflow-y: auto;
            padding-right: 1rem;
            margin-bottom: 1.5rem;
        }

        .legal-content h3 {
            margin-top: 1.5rem;
            margin-bottom: 1rem;
        }

        .legal-content p {
            margin-bottom: 1rem;
        }

        .legal-content ul {
            margin-bottom: 1rem;
            margin-left: 1.5rem;
        }

        .legal-content ul li {
            margin-bottom: 0.5rem;
        }

        /* Animations */
        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        @keyframes slideInLeft {
            from {
                transform: translateX(-50px);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        @keyframes slideInRight {
            from {
                transform: translateX(50px);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        @keyframes scaleIn {
            from {
                transform: scale(0.9);
                opacity: 0;
            }
            to {
                transform: scale(1);
                opacity: 1;
            }
        }

        .animate-fade-in {
            animation: fadeIn 1s forwards;
        }

        .animate-slide-left {
            animation: slideInLeft 1s forwards;
        }

        .animate-slide-right {
            animation: slideInRight 1s forwards;
        }

        .animate-scale-in {
            animation: scaleIn 1s forwards;
        }

        .delay-100 {
            animation-delay: 0.1s;
        }

        .delay-200 {
            animation-delay: 0.2s;
        }

        .delay-300 {
            animation-delay: 0.3s;
        }

        .delay-400 {
            animation-delay: 0.4s;
        }

        .delay-500 {
            animation-delay: 0.5s;
        }

        /* Responsive */
        @media (max-width: 992px) {
            h1 {
                font-size: 2.5rem;
            }

            h2 {
                font-size: 2rem;
            }

            .pricing-card.popular {
                transform: scale(1);
            }

            .pricing-card.popular:hover {
                transform: translateY(-10px);
            }
        }
      
        @media (max-width: 768px) {

            #how-to {
            display: none;
        }

            h1 {
                font-size: 2rem;
            }

            h2 {
                font-size: 1.75rem;
            }

            .hero-title {
                font-size: 2.5rem;
            }

            .hero-subtitle {
                font-size: 1.25rem;
            }

            .nav-toggle {
                display: block;
            }

            .nav-menu {
                position: fixed;
                top: 0;
                right: -100%;
                width: 80%;
                max-width: 400px;
                height: 100vh;
                background-color: var(--light);
                flex-direction: column;
                align-items: flex-start;
                padding: 5rem 2rem 2rem;
                transition: var(--transition);
                box-shadow: var(--shadow-lg);
                z-index: 1000;
            }

            .dark .nav-menu {
                background-color: var(--light);
            }

            .nav-menu.active {
                right: 0;

            .nav-item {
                margin: 0rem 0;

                display: block;

                padding: 0.75rem 0;

                flex-direction: column;
                width: 100%;
            }

            .hero-buttons .btn {
                width: 100%;
                margin-bottom: 1rem;
            }

            .cta-buttons {
                flex-direction: column;
                width: 100%;
            }

            .cta-buttons .btn {
                width: 100%;
                margin-bottom: 1rem;
            }

            .section {
                padding: 5rem 0;
            }
        }

        @media (max-width: 576px) {
            h1 {
                font-size: 1.75rem;
            }

            h2 {
                font-size: 1.5rem;
            }

            .hero {
                padding: 8rem 0 4rem;
            }

            .hero-title {
                font-size: 2rem;
            }

            .hero-subtitle {
                font-size: 1.1rem;
            }

            .section-title {
                font-size: 1.75rem;
            }

            .feature-card, .card, .step, .pricing-card {
                padding: 1.5rem;
            }
        }

        .code-block-container {
            position: relative;
        }

        .copy-btn {
            position: absolute;
            top: 0.2rem;
            right: 4rem;
            background: rgba(255, 255, 255, 0.1);
            color: white;
            border: none;
            border-radius: var(--border-radius-sm);
            padding: 0.25rem 0.5rem;
            font-size: 0.75rem;
            cursor: pointer;
            transition: var(--transition);
            z-index: 2;
        }

        .copy-btn:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .copy-btn i {
            margin-right: 0.25rem;
        }
    </style>
